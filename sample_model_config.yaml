# sample_model_config.yaml - API 转发配置模板（复制为 model_config.yaml 后修改）
# 支持多套配置，通过 current_setting 切换
current_setting: "DeepSeek"                        # 当前使用的配置名称

settings:
  DeepSeek:
    name: "DeepSeek"
    debug_mode: true                                # 是否打印详细请求/响应日志
    api_base_url: "https://api.deepseek.com/anthropic"
    api_key: "sk-your-deepseek-api-key-here"        # 替换为实际 API Key
    model_mapping:
      haiku: "deepseek-v4-flash"                    # Claude haiku → DeepSeek 模型
      sonnet: "deepseek-v4-pro"                     # Claude sonnet → DeepSeek 模型
      opus: "deepseek-v4-pro"                       # Claude opus → DeepSeek 模型
    effort_mapping:                                 # 根据模型等级设置 reasoning effort
      haiku: "high"                                 # 轻量任务
      sonnet: "xhigh"                               # 中等任务
      opus: "max"                                   # 复杂任务

